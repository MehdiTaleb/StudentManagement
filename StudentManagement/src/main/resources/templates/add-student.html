<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter un étudiant</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body class="form-page">

<div class="form-container">

    <!-- HEADER -->
    <div class="form-header">

        <h1>
            <i class="bi bi-person-plus-fill"></i>
            Ajouter un étudiant
        </h1>

        <p>
            Remplissez les informations du nouvel étudiant
        </p>

    </div>


    <!-- FORMULAIRE -->
    <form th:action="@{/saveStudent}"
          method="post"
          th:object="${student}">

        <!-- NOM -->
        <div class="form-group">

            <label for="name">
                Nom complet
                <span class="required-field">*</span>
            </label>

            <input type="text"
                   id="name"
                   th:field="*{name}"
                   class="form-control"
                   placeholder="Exemple : Mehdi Taleb"
                   required>

        </div>


        <!-- EMAIL -->
        <div class="form-group">

            <label for="email">
                Email
                <span class="required-field">*</span>
            </label>

            <input type="email"
                   id="email"
                   th:field="*{email}"
                   class="form-control"
                   placeholder="Exemple : mehdi@gmail.com"
                   required>

        </div>


        <!-- VILLE -->
        <div class="form-group">

            <label for="city">
                Ville
                <span class="required-field">*</span>
            </label>

            <input type="text"
                   id="city"
                   th:field="*{city}"
                   class="form-control"
                   placeholder="Exemple : Rabat"
                   required>

        </div>


        <!-- MOYENNE -->
        <div class="form-group">

            <label for="average">
                Moyenne
                <span class="required-field">*</span>
            </label>

            <div class="input-group">

                <input type="number"
                       id="average"
                       th:field="*{average}"
                       class="form-control"
                       placeholder="Exemple : 15.5"
                       min="0"
                       max="20"
                       step="0.01"
                       required>

                <span class="input-group-text">
                    / 20
                </span>

            </div>

            <div class="form-hint">
                La moyenne doit être comprise entre 0 et 20.
            </div>

        </div>


        <!-- BOUTONS -->
        <div class="form-actions">

            <a th:href="@{/students}"
               class="btn-cancel">

                <i class="bi bi-arrow-left"></i>
                Annuler

            </a>

            <button type="submit"
                    class="btn-primary-custom">

                <i class="bi bi-check-circle"></i>
                Enregistrer

            </button>

        </div>

    </form>


    <!-- RETOUR -->
    <div class="back-link">

        <a th:href="@{/students}">

            <i class="bi bi-list-ul"></i>
            Voir la liste des étudiants

        </a>

    </div>

</div>

</body>
</html>
